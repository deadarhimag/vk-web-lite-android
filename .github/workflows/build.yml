# Проверки при push. Сборка с релизным ключом и загрузка APK доступны при ручном запуске.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Скрипты страницы (видимость, скрытое окно, окна VK) в эмуляторе браузера.
      - name: JS tests
        working-directory: tests/js
        run: npm ci --no-audit --no-fund && npm test

  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.VKWEB_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Версия Gradle — из обёртки (gradle/wrapper/gradle-wrapper.properties, 4.1): та же, что в Android Studio.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Загрузка через сайт GitHub не сохраняет признак «исполняемый».
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Android Lint (4.1): мелкие кнопки, устаревшие API, доступность. Сборку не останавливает — отчёт в артефакте.
      - name: Android Lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # Ключ из секрета — во временный файл раннера (не в рабочую папку, не в журнал).
      - name: Release key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.VKWEB_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vkweb.jks"

      - name: Build release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          VKWEB_STORE_FILE: ${{ runner.temp }}/vkweb.jks
          VKWEB_STORE_PASSWORD: ${{ secrets.VKWEB_STORE_PASSWORD }}
          VKWEB_KEY_ALIAS: ${{ secrets.VKWEB_KEY_ALIAS }}
          VKWEB_KEY_PASSWORD: ${{ secrets.VKWEB_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove release key
        if: always() && env.HAS_RELEASE_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/vkweb.jks"

      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: vkweb-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Build debug APK
        if: env.HAS_RELEASE_KEY != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && env.HAS_RELEASE_KEY != 'true'
        with:
          name: vkweb-debug-apk
          path: app/build/outputs/apk/debug/*.apk
