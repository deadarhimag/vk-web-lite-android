# Проверки при push. Сборка с релизным ключом и загрузка APK доступны при ручном запуске.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Скрипты страницы (видимость, скрытое окно, окна VK) в эмуляторе браузера.
      - name: JS tests
        working-directory: tests/js
        run: npm ci --no-audit --no-fund && npm test

  build:
    needs: js-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Версия Gradle — из обёртки (gradle/wrapper/gradle-wrapper.properties, 4.1): та же, что в Android Studio.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Загрузка через сайт GitHub не сохраняет признак «исполняемый».
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # При ручной сборке ошибка Lint блокирует выпуск артефакта APK.
      - name: Android Lint
        continue-on-error: ${{ github.event_name == 'push' }}
        run: ./gradlew lintDebug --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Build signed release APKs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VKWEB_KEYSTORE_BASE64: ${{ secrets.VKWEB_KEYSTORE_BASE64 }}
          VKWEB_STORE_PASSWORD: ${{ secrets.VKWEB_STORE_PASSWORD }}
          VKWEB_KEY_ALIAS: ${{ secrets.VKWEB_KEY_ALIAS }}
          VKWEB_KEY_PASSWORD: ${{ secrets.VKWEB_KEY_PASSWORD }}
        run: |
          for required in VKWEB_KEYSTORE_BASE64 VKWEB_STORE_PASSWORD VKWEB_KEY_ALIAS VKWEB_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              printf '::error::Missing Actions secret %s\n' "$required"
              exit 1
            fi
          done

          if [[ -e keystore.properties ]]; then
            echo '::error::Unexpected local signing configuration'
            exit 1
          fi

          umask 077
          store_file=$(mktemp "$RUNNER_TEMP/vkweb.XXXXXXXX.p12")
          trap 'rm -f -- "$store_file"' EXIT
          printf '%s' "$VKWEB_KEYSTORE_BASE64" | base64 --decode > "$store_file"
          unset VKWEB_KEYSTORE_BASE64
          VKWEB_STORE_FILE="$store_file" ./gradlew :app:assembleRelease --no-daemon

      - name: Verify release APKs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          build_tools="${ANDROID_HOME:?}/build-tools/36.0.0"
          expected_certificate=915f50c1faf74d20eb0b81972a9adbb0d01416637c97c9fe197b0bb80e0d128f
          expected_package="package: name='io.github.deadarhimag.vkweblite' versionCode='222' versionName='5.00.14'"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 3 )); then
            echo '::error::Expected three release APKs'
            exit 1
          fi

          for apk in "${apks[@]}"; do
            signer_info=$("$build_tools/apksigner" verify --print-certs "$apk")
            mapfile -t digests < <(awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print $NF}' <<< "$signer_info")
            if (( ${#digests[@]} != 1 )) || [[ "${digests[0],,}" != "$expected_certificate" ]]; then
              printf '::error::Unexpected signing certificate for %s\n' "$apk"
              exit 1
            fi
            package_info=$("$build_tools/aapt" dump badging "$apk")
            IFS= read -r package_line <<< "$package_info"
            if [[ "$package_line" != "$expected_package "* ]]; then
              printf '::error::Unexpected package or version for %s\n' "$apk"
              exit 1
            fi
            printf 'Verified %s with certificate SHA-256 %s\n' "$apk" "$expected_certificate"
          done

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: vkweb-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK
        if: github.event_name == 'push'
        run: ./gradlew assembleDebug --no-daemon
